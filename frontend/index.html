<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Customer Churn Prediction</h1>
            <p>Enter customer details to predict the likelihood of churn.</p>
        </div>

        <form id="churnForm">

            <div class="form-grid">

                <!-- Gender -->
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                    </select>
                </div>

                <!-- Senior Citizen -->
                <div class="form-group">
                    <label for="SeniorCitizen">Senior Citizen</label>
                    <select id="SeniorCitizen">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <!-- Partner -->
                <div class="form-group">
                    <label for="Partner">Partner</label>
                    <select id="Partner">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Dependents -->
                <div class="form-group">
                    <label for="Dependents">Dependents</label>
                    <select id="Dependents">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Tenure -->
                <div class="form-group">
                    <label for="tenure">Tenure (months)</label>
                    <input
                        type="number"
                        id="tenure"
                        min="0"
                        placeholder="Enter tenure"
                        required
                    >
                </div>

                <!-- Phone Service -->
                <div class="form-group">
                    <label for="PhoneService">Phone Service</label>
                    <select id="PhoneService">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Multiple Lines -->
                <div class="form-group">
                    <label for="MultipleLines">Multiple Lines</label>
                    <select id="MultipleLines">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Internet Service -->
                <div class="form-group">
                    <label for="InternetService">Internet Service</label>
                    <select id="InternetService">
                        <option value="DSL">DSL</option>
                        <option value="Fiber optic">Fiber optic</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Online Security -->
                <div class="form-group">
                    <label for="OnlineSecurity">Online Security</label>
                    <select id="OnlineSecurity">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Online Backup -->
                <div class="form-group">
                    <label for="OnlineBackup">Online Backup</label>
                    <select id="OnlineBackup">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Device Protection -->
                <div class="form-group">
                    <label for="DeviceProtection">Device Protection</label>
                    <select id="DeviceProtection">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Tech Support -->
                <div class="form-group">
                    <label for="TechSupport">Tech Support</label>
                    <select id="TechSupport">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Streaming TV -->
                <div class="form-group">
                    <label for="StreamingTV">Streaming TV</label>
                    <select id="StreamingTV">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Streaming Movies -->
                <div class="form-group">
                    <label for="StreamingMovies">Streaming Movies</label>
                    <select id="StreamingMovies">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <!-- Contract -->
                <div class="form-group">
                    <label for="Contract">Contract</label>
                    <select id="Contract">
                        <option value="Month-to-month">Month-to-month</option>
                        <option value="One year">One year</option>
                        <option value="Two year">Two year</option>
                    </select>
                </div>

                <!-- Paperless Billing -->
                <div class="form-group">
                    <label for="PaperlessBilling">Paperless Billing</label>
                    <select id="PaperlessBilling">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Payment Method -->
                <div class="form-group">
                    <label for="PaymentMethod">Payment Method</label>
                    <select id="PaymentMethod">
                        <option value="Electronic check">Electronic check</option>
                        <option value="Mailed check">Mailed check</option>
                        <option value="Bank transfer (automatic)">
                            Bank transfer (automatic)
                        </option>
                        <option value="Credit card (automatic)">
                            Credit card (automatic)
                        </option>
                    </select>
                </div>

                <!-- Monthly Charges -->
                <div class="form-group">
                    <label for="MonthlyCharges">Monthly Charges</label>
                    <input
                        type="number"
                        id="MonthlyCharges"
                        step="0.01"
                        min="0"
                        placeholder="e.g. 70.5"
                        required
                    >
                </div>

                <!-- Total Charges -->
                <div class="form-group">
                    <label for="TotalCharges">Total Charges</label>
                    <input
                        type="number"
                        id="TotalCharges"
                        step="0.01"
                        min="0"
                        placeholder="e.g. 846"
                        required
                    >
                </div>

            </div>

            <button type="submit" id="predictBtn">
                Predict Churn
            </button>

        </form>

        <!-- Loading -->
        <div id="loading" class="loading hidden">
            Predicting...
        </div>

        <!-- Result -->
        <div id="result" class="result hidden">

            <h2>Prediction Result</h2>

            <div class="result-box">
                <p>
                    <strong>Prediction:</strong>
                    <span id="prediction"></span>
                </p>

                <p>
                    <strong>Churn Probability:</strong>
                    <span id="probability"></span>
                </p>
            </div>

        </div>

        <!-- Error -->
        <div id="error" class="error hidden"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
